<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0f0f10"/>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45e0a2"/>
      <stop offset="100%" stop-color="#23ba93"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 배경 글로우 -->
  <circle cx="256" cy="256" r="190" fill="rgba(62,213,152,0.07)"/>
  <!-- 연필 아이콘 (24x24 루시드 → 512px 스케일) -->
  <g filter="url(#glow)"
     transform="translate(118,118) scale(11.5)"
     stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round"
     fill="none" stroke-width="2.2">
    <path d="M12 20h9"/>
    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
  </g>
</svg>
